{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4>Register as Customer</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" id="id_username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" id="id_email" required>
                    </div>
                    
                    <!-- POSTCODE FIELD - MAKE SURE THIS EXISTS -->
                    <div class="mb-3">
                        <label for="id_postcode" class="form-label">Postcode</label>
                        <input type="text" name="postcode" class="form-control" id="id_postcode" placeholder="e.g., BS1 5JG" required>
                        <small class="text-muted">Used to calculate food miles from producers</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_phone" class="form-label">Phone (optional)</label>
                        <input type="text" name="phone" class="form-control" id="id_phone">
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_address" class="form-label">Address (optional)</label>
                        <textarea name="address" class="form-control" id="id_address" rows="2"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password1" class="form-label">Password</label>
                        <input type="password" name="password1" class="form-control" id="id_password1" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password2" class="form-label">Confirm Password</label>
                        <input type="password" name="password2" class="form-control" id="id_password2" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
