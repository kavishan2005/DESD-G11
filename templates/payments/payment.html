{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4>💳 Payment for Order #{{ order.order_number }}</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <strong>Order Total:</strong> £{{ order.total }}
                    </div>
                    
                    <form id="payment-form">
                        {% csrf_token %}
                        <div id="card-element" class="form-control mb-3" style="padding: 12px;"></div>
                        <div id="card-errors" class="alert alert-danger" style="display: none;"></div>
                        <button id="submit-button" class="btn btn-success w-100">Pay £{{ order.total }}</button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <small class="text-muted">Test Card: 4242 4242 4242 4242</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
    const stripe = Stripe('{{ stripe_public_key }}');
    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');
    
    const form = document.getElementById('payment-form');
    const submitButton = document.getElementById('submit-button');
    
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        submitButton.textContent = 'Processing...';
        
        const { paymentIntent, error } = await stripe.confirmCardPayment(
            '{{ client_secret }}',
            {
                payment_method: {
                    card: cardElement,
                    billing_details: {
                        name: '{{ request.user.username }}',
                        email: '{{ request.user.email }}'
                    }
                }
            }
        );
        
        if (error) {
            const errorElement = document.getElementById('card-errors');
            errorElement.textContent = error.message;
            errorElement.style.display = 'block';
            submitButton.disabled = false;
            submitButton.textContent = 'Pay £{{ order.total }}';
        } else if (paymentIntent.status === 'succeeded') {
            window.location.href = "{% url 'payments:payment_success' order.id %}";
        }
    });
</script>
{% endblock %}
